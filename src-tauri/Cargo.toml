[package]
name = "acantha"
version = "0.2.3"
description = "A Git client with a commit graph, terminals and an editor"
edition = "2021"
license-file = "../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-opener = "2"
base64 = "0.22"
notify-debouncer-mini = "0.7"
ignore = "0.4"
tauri-plugin-clipboard-manager = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
