[package]
name = "git-graph"
version = "0.1.0"
description = "A standalone Git Graph viewer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-opener = "2"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
