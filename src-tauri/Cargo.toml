[package]
name = "acantha"
version = "0.2.8"
description = "A Git client with a commit graph, terminals and an editor"
edition = "2021"
license-file = "../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-opener = "2"
base64 = "0.22"
notify-debouncer-mini = "0.7"
ignore = "0.4"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "=2.5.1"
# Talks to a local OpenCode server (see opencode.rs): the version Tauri already has, plain HTTP only.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }

# The Claude window joins full-screen Spaces (see claude.rs), through the AppKit bindings Tauri already uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSGraphics"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
