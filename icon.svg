<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="0.55" stop-color="#16171f"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <!-- In user space: a gradient sized to a vertical line's zero-width box would not render. -->
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="820">
      <stop offset="0" stop-color="#a8cdff"/>
      <stop offset="1" stop-color="#5b8fe0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c4ff"/>
      <stop offset="1" stop-color="#a36fe0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6f0c2"/>
      <stop offset="1" stop-color="#4fb57a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="clip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Drop shadow under the tile, as macOS icons have. -->
  <rect x="112" y="128" width="800" height="800" rx="180" fill="#000" opacity="0.45" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <g transform="translate(-48 -6)">
    <!-- The graph, drawn twice: a blurred copy for the glow, then the crisp lines. -->
    <g fill="none" stroke-linecap="round" stroke-width="58" opacity="0.75" filter="url(#bloom)">
      <path d="M400 230V800" stroke="#6ea8e8"/>
      <path d="M400 330C400 430 624 400 624 500V560C624 660 400 630 400 720" stroke="#b98ce0"/>
      <path d="M400 470C400 540 720 520 720 610V690" stroke="#6ec48f"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-width="46">
      <path d="M400 230V800" stroke="url(#blue)"/>
      <path d="M400 330C400 430 624 400 624 500V560C624 660 400 630 400 720" stroke="url(#violet)"/>
      <path d="M400 470C400 540 720 520 720 610V690" stroke="url(#green)"/>
    </g>

    <!-- Commits. The top one is HEAD, drawn as a ring. -->
    <g stroke="#14151c" stroke-width="16">
      <circle cx="400" cy="230" r="58" fill="#14151c" stroke="url(#blue)" stroke-width="30"/>
      <circle cx="624" cy="530" r="50" fill="url(#violet)"/>
      <circle cx="720" cy="690" r="50" fill="url(#green)"/>
      <circle cx="400" cy="720" r="50" fill="url(#blue)"/>
      <circle cx="400" cy="470" r="44" fill="url(#blue)"/>
    </g>
    </g>

    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <!-- A hairline edge, light at the top, like Big Sur icons. -->
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
</svg>
